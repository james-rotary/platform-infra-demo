apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-content-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/james-rotary/web-content-config.git
    targetRevision: development
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: web-content
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
