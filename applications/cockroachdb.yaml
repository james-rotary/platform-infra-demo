apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockroachdb-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/james-rotary/platform-infra-demo.git
    targetRevision: development
    path: cockroachdb
  destination:
    server: https://kubernetes.default.svc
    namespace: crdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
