apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-logical-dbs
  namespace: crdb
  labels:
    job-type: db-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Not a hook; runs once on initial sync. Remove if you prefer PreSync semantics.
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sql
          image: cockroachdb/cockroach:v23.2.17
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for CockroachDB readiness..."
              for i in $(seq 1 40); do
                /cockroach/cockroach sql --insecure --host=cockroachdb-public:26257 -e 'select 1;' && break
                echo "Not ready yet ($i)"; sleep 3;
              done
              echo "Applying logical DB + role init..."
              /cockroach/cockroach sql --insecure --host=cockroachdb-public:26257 -f /init/init-logical-dbs.sql
          volumeMounts:
            - name: init-sql
              mountPath: /init
      volumes:
        - name: init-sql
          configMap:
            name: logical-db-init
